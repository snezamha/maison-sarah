<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order - Maison Sarah</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <div class="container header-bar">
        <h1 class="brand">Maison Sarah</h1>

        <nav>
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="order.html">Order</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h1>Weekend Pre-Orders</h1>

        <p>Order your favourite bakery items for weekend pickup.</p>

        <form action="#" method="get">
          <fieldset>
            <legend>Who is picking up</legend>

            <label for="customer-name"> Your name </label>

            <input
              class="field"
              type="text"
              id="customer-name"
              name="customer-name"
              placeholder="Sarah Example"
              required
            />

            <label for="email"> Your email </label>

            <input
              class="field"
              type="email"
              id="email"
              name="email"
              placeholder="sarah@example.com"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Pickup day</legend>

            <div class="choice">
              <input
                type="radio"
                id="saturday"
                name="pickup-day"
                value="saturday"
                checked
              />

              <label for="saturday"> Saturday </label>
            </div>

            <div class="choice">
              <input
                type="radio"
                id="sunday"
                name="pickup-day"
                value="sunday"
              />

              <label for="sunday"> Sunday </label>
            </div>

            <label for="pickup-time"> Pickup time </label>

            <select class="field" id="pickup-time" name="pickup-time">
              <option value="09:00">09:00</option>

              <option value="11:00">11:00</option>

              <option value="13:00">13:00</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Your order</legend>

            <div class="choice">
              <input
                type="checkbox"
                id="croissant"
                name="order-croissant"
                value="croissant"
              />

              <label for="croissant"> Butter Croissant </label>
            </div>

            <div class="choice">
              <input
                type="checkbox"
                id="cake"
                name="order-cake"
                value="chocolate-cake"
              />

              <label for="cake"> Chocolate Cake </label>
            </div>

            <div class="choice">
              <input
                type="checkbox"
                id="tart"
                name="order-tart"
                value="fruit-tart"
              />

              <label for="tart"> Fruit Tart </label>
            </div>

            <label for="notes"> Notes for the bakers </label>

            <textarea
              class="field"
              id="notes"
              name="notes"
              placeholder="Any special requests?"
              rows="5"
            ></textarea>
          </fieldset>
          <button type="submit">Submit Order</button>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>© Maison Sarah</p>
      </div>
    </footer>
  </body>
</html>
